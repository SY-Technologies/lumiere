name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: Release
            cmake_extra_args: ""
          - os: macos-latest
            build_type: Release
            cmake_extra_args: ""
          - os: windows-latest
            build_type: Release
            cmake_extra_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_TESTING=ON ${{ matrix.cmake_extra_args }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  sanitizers:
    name: Linux / address and undefined behavior sanitizers
    runs-on: ubuntu-latest
    env:
      # Reference cycles are a separate GC milestone; still check memory access.
      ASAN_OPTIONS: detect_leaks=0:detect_stack_use_after_return=1
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build-sanitizers -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined,float-cast-overflow -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build-sanitizers --parallel 2
      - name: Test
        run: ctest --test-dir build-sanitizers --output-on-failure --parallel 2
